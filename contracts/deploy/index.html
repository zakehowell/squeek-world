<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Deploy Squeek Pet World</title>
    <!--
      Deploys Squeek Pet World's contracts to Sepolia from your own browser wallet.
      Run `npm run deploy:page` in the repository root and open http://127.0.0.1:1420/contracts/deploy/
      The page holds no key: every transaction is shown in your wallet before it goes out.
    -->
    <style>
      :root {
        --ink: #213b2e;
        --paper: #f3eedc;
        --card: #fffcf2;
        --muted: #5d6f63;
        --gold: #f2b23e;
        --ok: #2f7d3b;
        --bad: #b3261e;
        --warn: #8a5a00;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 15px/1.55 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #app {
        max-width: 820px;
        margin: 0 auto;
        padding: 28px 16px 56px;
        display: grid;
        gap: 18px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 26px;
        line-height: 1.2;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      h3 {
        margin: 16px 0 8px;
        font-size: 15px;
      }
      a {
        color: var(--ink);
        text-underline-offset: 2px;
      }
      .top {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        justify-content: space-between;
      }
      .lead {
        margin: 0 0 12px;
        color: var(--muted);
      }
      .top .lead {
        margin: 0;
        max-width: 60ch;
      }
      .card {
        background: var(--card);
        border: 2px solid var(--ink);
        box-shadow: 4px 4px 0 0 var(--ink);
        padding: 18px 20px;
      }
      .btn {
        font: inherit;
        font-weight: 600;
        color: var(--ink);
        background: var(--card);
        border: 2px solid var(--ink);
        box-shadow: 2px 2px 0 0 var(--ink);
        padding: 7px 14px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .btn:hover:not(:disabled) {
        background: #fff3d1;
      }
      .btn:active:not(:disabled) {
        transform: translate(2px, 2px);
        box-shadow: none;
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .btn.primary {
        background: var(--gold);
      }
      .btn.primary:hover:not(:disabled) {
        background: #f6c460;
      }
      .btn.small {
        padding: 3px 10px;
        font-size: 13px;
      }
      .btn.quiet {
        box-shadow: none;
        border-color: transparent;
        background: none;
        text-decoration: underline;
        font-weight: 500;
      }
      .btn:focus-visible,
      input:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 2px;
      }
      .wallets {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .rows {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 6px 18px;
        margin: 0;
      }
      .rows dt {
        color: var(--muted);
      }
      .rows dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .rows .mark {
        margin-right: 4px;
      }
      fieldset {
        border: 0;
        border-top: 2px dashed #c9c1a4;
        margin: 14px 0 0;
        padding: 12px 0 0;
      }
      legend {
        font-weight: 700;
        padding-right: 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px 18px;
      }
      .field {
        display: grid;
        gap: 4px;
        align-content: start;
      }
      .field .label {
        font-weight: 600;
        font-size: 14px;
      }
      .field input,
      .field output {
        font: inherit;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        background: #fff;
        border: 2px solid var(--ink);
        padding: 6px 8px;
        min-width: 0;
      }
      .field output {
        background: #efe9d4;
      }
      .field.wide {
        grid-column: 1 / -1;
      }
      .field.wide input {
        max-width: calc(50% - 9px);
      }
      .field input:disabled {
        background: #efe9d4;
        color: var(--muted);
      }
      .field input[aria-invalid="true"] {
        border-color: var(--bad);
      }
      .hint,
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
      .problem {
        color: var(--bad);
        font-size: 13px;
      }
      .problem:empty {
        display: none;
      }
      .toggle {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
        font-weight: 600;
      }
      .toggle input {
        width: 18px;
        height: 18px;
        accent-color: var(--ink);
      }
      .note {
        margin: 8px 0;
        padding: 8px 12px;
        border-left: 4px solid var(--ink);
        background: #f6f0dc;
      }
      .note.locked {
        border-color: var(--gold);
      }
      .note.warn {
        border-color: var(--warn);
      }
      .note.bad {
        border-color: var(--bad);
        color: var(--bad);
        background: #fbeceb;
      }
      .checks {
        list-style: none;
        margin: 0 0 14px;
        padding: 0;
        display: grid;
        gap: 4px;
      }
      .checks li {
        display: flex;
        gap: 8px;
        align-items: baseline;
        overflow-wrap: anywhere;
      }
      .mark {
        flex: none;
        width: 1.2em;
        text-align: center;
        font-weight: 700;
      }
      .mark.ok {
        color: var(--ok);
      }
      .mark.bad {
        color: var(--bad);
      }
      .mark.wait {
        color: var(--muted);
      }
      .steps {
        margin: 0 0 16px;
        padding-left: 1.6em;
        display: grid;
        gap: 10px;
      }
      .step-head {
        display: flex;
        gap: 12px;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .step strong {
        font-weight: 600;
      }
      .step.done strong {
        color: var(--muted);
      }
      .status {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .status.done {
        color: var(--ok);
      }
      .status.failed,
      .status.lost {
        color: var(--bad);
      }
      .status.todo {
        color: var(--muted);
      }
      .status.wallet,
      .status.mining {
        color: var(--warn);
      }
      .step-links {
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .spinner {
        width: 10px;
        height: 10px;
        background: currentColor;
        animation: blink 0.9s steps(2, start) infinite;
      }
      @keyframes blink {
        to {
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      .config-head {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      .config {
        margin: 0;
        padding: 12px 14px;
        background: #1f2a24;
        color: #f3eedc;
        font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        overflow-x: auto;
        user-select: all;
      }
      .contracts {
        margin: 0;
        padding-left: 1.2em;
        display: grid;
        gap: 4px;
      }
      .contracts li span {
        display: inline-block;
        min-width: 7.5em;
        font-weight: 600;
      }
      .contracts a,
      .rows a,
      .step-links a,
      .checks span {
        font-variant-numeric: tabular-nums;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 560px) {
        .top {
          flex-direction: column-reverse;
          align-items: flex-end;
        }
        .top > div {
          align-self: stretch;
        }
        .card {
          padding: 14px;
        }
        .rows {
          grid-template-columns: 1fr;
          gap: 0;
        }
        .rows dd {
          margin-bottom: 8px;
        }
        .field.wide input {
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./deploy.ts"></script>
  </body>
</html>
